name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare compact Full-Round SQLite asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          unzip -o data/fullround_rankpair_app_v3.sqlite.zip -d app/src/main/assets
          rm -f app/src/main/assets/FULLROUND_APP_DB_README.txt
          ls -lh app/src/main/assets

      - name: Validate SQLite asset
        run: |
          python3 tools/validate_app_db.py app/src/main/assets/fullround_rankpair_app_v3.sqlite

      - name: Smoke-test canonical signature logic
        run: |
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/com/gesundheit/fullround/SignatureUtil.java \
            tools/SignatureUtilSmokeTest.java
          java -cp build/smoke SignatureUtilSmokeTest

      - name: Smoke-test Full-Round CLI
        run: |
          python3 tools/test_fullround.py app/src/main/assets/fullround_rankpair_app_v3.sqlite

      - name: Bootstrap Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fullround-rankpair-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
