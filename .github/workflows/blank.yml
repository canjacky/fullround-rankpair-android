name: Build FullRound APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack complete app ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f FullRound_RankPair_APP_COMPLETE.zip
          rm -rf project
          mkdir project
          unzip -q FullRound_RankPair_APP_COMPLETE.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/assets/fullround_rankpair_app_v3.sqlite
          echo "App ZIP successfully unpacked."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Validate database
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_app_db.py app/src/main/assets/fullround_rankpair_app_v3.sqlite

      - name: Smoke tests
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/smoke
          javac -d build/smoke app/src/main/java/com/gesundheit/fullround/SignatureUtil.java tools/SignatureUtilSmokeTest.java
          java -cp build/smoke SignatureUtilSmokeTest
          python3 tools/test_fullround.py app/src/main/assets/fullround_rankpair_app_v3.sqlite

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" ../FullRound-RankPair-debug.apk
          sha256sum ../FullRound-RankPair-debug.apk > ../FullRound-RankPair-debug.apk.sha256
          ls -lh ../FullRound-RankPair-debug.apk*

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: FullRound-RankPair-APK
          path: |
            FullRound-RankPair-debug.apk
            FullRound-RankPair-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Add APK download link
        shell: bash
        run: |
          echo "## APK fertig" >> "$GITHUB_STEP_SUMMARY"
          echo "[**FullRound-RankPair-APK herunterladen**](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
